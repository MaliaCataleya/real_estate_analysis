services:
  postgres:
    image: postgres:17
    container_name: estate-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  etl:
    build:
      context: ./etl_pipeline
      dockerfile: Dockerfile
    container_name: estate-etl
    depends_on:
      - postgres
    volumes:
      - etl_data:/app/data
    env_file:
      - .env

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estate-backend
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

  frontend:
    build:
      context: ./frontend/estate-frontend
      dockerfile: Dockerfile
    container_name: estate-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  etl_data:
