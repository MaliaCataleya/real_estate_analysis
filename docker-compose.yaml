services:
  postgres:
    image: postgres:17
    container_name: estate-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  pgadmin: 
    image: dpage/pgadmin4
    container_name: estate-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEF_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEF_PASSWORD}
    ports:
      - "5050:80"
  
  etl:
    build:
      context: ./etl_pipeline
      dockerfile: Dockerfile
    container_name: estate-etl
    depends_on:
      - postgres
    volumes:
      - etl_data:/app/data
    env_file:
      - .env

volumes:
  pgdata:
  etl_data:
